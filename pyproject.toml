[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "beyond-handshake"
version = "0.1.0"
description = "A controlled study of browserless automation and cross-layer network observations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "h2==4.4.1",
]

[project.scripts]
bh = "beyond_handshake.cli:main"

[project.optional-dependencies]
impersonation = [
    "curl-cffi==0.16.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
